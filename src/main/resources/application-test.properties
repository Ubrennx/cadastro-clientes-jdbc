spring.application.name=cadastroclientes-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=0123456789
jwt.expiration-ms=3600000

admin.default.email=admin@test.local
admin.default.senha=TestAdmin123

n8n.webhook.url=http://localhost:5678/webhook/compra-realizada
n8n.webhook.secret=test-webhook-secret
admin.notificacao.email=admin@test.local